[workspace]
resolver = "2"
members = ["crates/core", "crates/store", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Suzye-Rf <2869280778@qq.com>"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
toml = "0.8"
mongodb = "2"
bson = "2"
steadycore = { path = "crates/core" }
steadycore-store = { path = "crates/store" }

[profile.release]
opt-level = 2
